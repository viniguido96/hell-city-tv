name: Build APK

on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # The release is signed with the debug key. Keeping that key between runs lets each build install over
      # the last one on the TV (adb install -r) instead of uninstalling Home first.
      - name: Signing key from earlier builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hell-city-debug-keystore-v1
      - name: Release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hell-city-tv-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
